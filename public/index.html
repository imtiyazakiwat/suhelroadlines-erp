    <meta charset="utf-8" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on
         iPhone. Note there is deliberately no maximum-scale / user-scalable=no:
         pinch-zoom is an accessibility feature, and disabling it is the single
         most common way a "native-feeling" web app becomes unusable for someone
         who needs to magnify a number. iOS focus-zoom is prevented the correct
         way instead, by never letting an input fall below 16px (--field-font). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Suhel Roadlines</title>
    <meta name="description" content="Trip, advance and STR management for Suhel Roadlines." />
    <meta name="application-name" content="Suhel Roadlines" />

    <!-- Standalone mode. `apple-mobile-web-app-capable` is what actually removes
         Safari's URL bar and toolbar for a Home Screen launch on iOS; the
         manifest's `display` member alone is not honoured on older iOS, so both
         are declared. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The Home Screen label. Without this iOS uses <title>, which is fine here
         but would break the moment a screen sets a longer document title. -->
    <meta name="apple-mobile-web-app-title" content="Suhel Roadlines" />

    <!-- Status bar.

         `default` (not `black-translucent`) is a deliberate choice. Translucent
         extends the web view under the status bar, which sounds more native, but
         it also forces white status-bar glyphs — unreadable over this app's light
         peach header in light mode, and unfixable from CSS. `default` keeps the
         status bar in its own strip which iOS tints from theme-color below, so it
         adapts to light and dark instead of being wrong in one of them. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- theme-color is paired to the appearance so the status-bar strip matches
         the TOP of the app's gradient wash (`.app-shell::before`), not white.
         A single theme-color would leave a visible seam in one of the two modes. -->
    <meta name="theme-color" content="#FBE1CB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2A1D14" media="(prefers-color-scheme: dark)" />

    <!-- Tells the UA that both appearances are supported, so form controls,
         scrollbars and the canvas behind rubber-band overscroll are drawn dark in
         dark mode rather than defaulting to light. -->
    <meta name="color-scheme" content="light dark" />

    <!-- Phone numbers are rendered by PhoneField and must not be auto-linked:
         iOS would restyle them mid-layout and hijack the tap target. -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Home Screen icon. iOS applies its own rounded mask, so these are
         full-bleed squares. Largest-first is not enough — iOS picks by `sizes`,
         so each supported density is declared explicitly. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/icons/icon-120.png" />

    <!-- Browser tab. SVG first for anything that supports it, PNG as the
         fallback. There is no favicon.ico: every browser this app supports reads
         PNG or SVG, and an .ico would be a fourth copy of the same artwork. -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16.png" />
    <link rel="mask-icon" href="%PUBLIC_URL%/favicon.svg" color="#0A2450" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
